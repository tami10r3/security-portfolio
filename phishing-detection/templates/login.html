<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
</head>

<body style="font-family:Arial;background:#0f172a;color:white;display:flex;justify-content:center;align-items:center;height:100vh;">

<div style="background:#111827;padding:30px;border-radius:10px;width:300px;">

<h2>Admin Login</h2>

<form method="POST">

<input type="text" name="username" placeholder="Username" required style="width:100%;padding:10px;margin-bottom:10px;">

<input type="password" name="password" placeholder="Password" required style="width:100%;padding:10px;margin-bottom:10px;">

<button type="submit" style="width:100%;padding:10px;background:#2563eb;color:white;border:none;">
Login
</button>

</form>

</div>

</body>
</html>
